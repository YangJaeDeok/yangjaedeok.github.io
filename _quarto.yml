project:
  type: website
  output-dir: _site
  pre-render: bash scripts/check-giscus-ids.sh
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "topics/*.qmd"

lang: ko
date-format: "YYYY-MM-DD"

website:
  title: "The Blog"
  site-url: https://yangjaedeok.github.io
  description: "nomad @physics @cs — not mad, just curious."
  open-graph: true
  twitter-card: true
  # image: /images/og.png
  page-footer:
    center: "© Copyright [2022-2026]{.js-year data-start=2022} YangJaeDeok(양재덕)"
  comments:
    giscus:
      repo: YangJaeDeok/yangjaedeok.github.io
      repo-id: R_kgDOVXhyfg
      category: Comments
      category-id: DIC_kwDOVXhyfs4DJ4kU
      mapping: pathname
      reactions-enabled: true
      input-position: top
      loading: lazy
      language: ko
  navbar:
    left:
      - text: Physics
        menu:
          - text: All Physics
            href: topics/physics/physics.qmd
          - text: Quantum Information
            href: topics/physics/quantum-information/quantum-information.qmd
          - text: Quantum Mechanics
            href: topics/physics/quantum-mechanics/quantum-mechanics.qmd
          - text: Thermal and Statistical Physics
            href: topics/physics/thermal-n-statistical-physics/thermal-n-statistical-physics.qmd
      - text: Programming
        href: topics/programming/programming.qmd
      - text: Computer Science
        menu:
          - text: All Computer Science
            href: topics/computer-science/computer-science.qmd
          - text: Classical Computing
            href: topics/computer-science/classical-computing.qmd
          - text: Quantum Computing
            href: topics/computer-science/quantum-computing.qmd
      - text: Projects
        menu:
          - text: All Projects
            href: topics/projects/projects.qmd
          - text: HomeLab
            href: topics/projects/homelab/homelab.qmd
      - text : Design
        href: topics/design/design.qmd
      - text: Guestbook
        href: guestbook.qmd
    right:
      - about-me.qmd
      - icon: github
        href: https://github.com/YangJaeDeok
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/yangjaedeok/
        aria-label: LinkedIn

format:
  html:
    theme: cosmo
    css: styles.css
    include-in-header:
      - text: |
          <meta name="google-site-verification" content="mqWdD_nVq4kMBGxWaaMFQ7pBBjpBxkepkF35hFNWfzw" />
    include-after-body: footer-year.html
    toc: true
    code-copy: true
    html-math-method: katex

execute:
  freeze: auto
