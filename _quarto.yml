project:
  type: website
  output-dir: _site
  pre-render: bash scripts/check-giscus-ids.sh
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "topics/*.qmd"

lang: ko
date-format: "YYYY-MM-DD"

website:
  title: "YangJaedeok's Blog"
  site-url: https://yangjaedeok.github.io
  comments:
    giscus:
      repo: YangJaeDeok/yangjaedeok.github.io
      repo-id: R_kgDOVXhyfg
      category: Comments
      category-id: DIC_kwDOVXhyfs4DJ4kU
      mapping: pathname
      reactions-enabled: true
      input-position: top
      loading: lazy
      language: ko
  navbar:
    left:
      - text: Physics
        menu:
          - text: All Physics
            href: topics/physics/physics.qmd
          - text: Quantum Information
            href: topics/physics/quantum-information.qmd
          - text: Quantum Mechanics
            href: topics/physics/quantum-mechanics.qmd
          - text: Thermal and Statistical Physics
            href: topics/physics/thermal-n-statistical-physics
      - text: Programming
        href: topics/programming/programming.qmd
      - text: Computer Science
        menu:
          - text: All Computer Science
            href: topics/computer-science/computer-science.qmd
          - text: Classical Computing
            href: topics/computer-science/classical-computing.qmd
          - text: Quantum Computing
            href: topics/computer-science/quantum-computing.qmd
      - text : Projects
        href: : topics/projects.qmd
      - text : Design
        href: : topics/design/design.qmd
      - text: Guestbook
        href: index.html#guestbook
    right:
      - about.qmd
      - icon: github
        href: https://github.com/YangJaeDeok
        aria-label: GitHub

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true

execute:
  freeze: auto
